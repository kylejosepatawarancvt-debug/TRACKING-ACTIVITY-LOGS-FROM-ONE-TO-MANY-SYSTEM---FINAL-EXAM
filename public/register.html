<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific enhancements for the registration container centering */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at top right, #f8fafc, #cbd5e1);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h2 {
            font-size: 1.6rem;
            color: #0f172a;
            margin-bottom: 8px;
            justify-content: center;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .auth-card label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .auth-card input {
            width: 100%;
            padding: 12px 16px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #0f172a;
            transition: all 0.2s ease;
        }

        .auth-card input:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .auth-card button[type="submit"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .auth-card button[type="submit"]:hover {
            background-color: #2563eb;
        }

        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }

        .auth-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Register a security profile to access the PM Workspace</p>
            </div>

            <form id="regForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter a unique username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit">Sign Up</button>
            </form>

            <div class="auth-footer">
                Already have an active profile? <a href="login.html">Login here</a>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput.value, password: passwordInput.value })
            });
            
            const data = await res.json();
            if (data.error) {
                alert(data.error);
            } else {
                alert(data.success);
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
